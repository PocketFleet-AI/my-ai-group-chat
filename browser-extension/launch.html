<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>正在唤起 PocketFleet 桌面客户端</title>
  <!--
    接力页 UI（游隼 2026-10-12 接手）
    约法三章遵守：
      ① 脚本保持独立外链 launch.js，无内联 <script>
      ② 核心 ID 全部保留：#btnRetryLaunch #btnCloseTab #statusBadge #statusText
      ③ 与 popup.css 同源（蓝调玻璃层 + 暖色注释），宽屏版式
  -->
  <style>
    :root {
      --ink: #12213c;
      --ink-2: #33456b;
      --muted: #6d7ea6;
      --line: #d3dff5;
      --blue: #1f5fd4;
      --blue-d: #1848a3;
      --blue-l: #3b7ff0;
      --tint: #eaf2fe;
      --ok: #1f9d5c;
      --ok-bg: #e3f7ed;
      --ok-line: #a8e0c1;
      --amber: #5c4a12;
      --amber-bg: #fff5dc;
      --amber-line: #f0d79a;
      --rose: #8c2f1c;
      --rose-bg: #fdeae5;
      --rose-line: #f4c9bd;
      --page-1: #eaf3ff;
      --page-2: #d6e7fb;
      --page-3: #c3dcfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      color: var(--ink);
      overflow-x: hidden;
      background: linear-gradient(170deg, var(--page-1) 0%, var(--page-2) 55%, var(--page-3) 100%);
    }
    /* 白光斑：与弹窗同语言，避免大面积渐层发闷 */
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(420px 300px at 84% 8%, rgba(255, 255, 255, .55), transparent 70%),
        radial-gradient(520px 380px at 8% 96%, rgba(255, 255, 255, .42), transparent 70%);
    }

    .launch-card {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 32px 30px 26px;
      border-radius: 20px;
      text-align: center;
      background: linear-gradient(150deg, rgba(255, 255, 255, .74), rgba(226, 238, 253, .68));
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 20px 46px -12px rgba(30, 70, 140, .22), 0 3px 10px rgba(20, 40, 80, .05);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cardIn .45s cubic-bezier(.2, .8, .3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px) scale(.985); }
      to { opacity: 1; transform: none; }
    }

    /* ---------- Header 横向布局：Logo 位于标题左侧 ---------- */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      margin-bottom: 4px;
    }
    .header-text {
      text-align: left;
    }

    /* ---------- Logo 呼吸 ---------- */
    .logo-pulse {
      position: relative;
      width: 64px; height: 64px;
      display: grid; place-items: center;
      flex: 0 0 64px;
      margin-bottom: 0;
    }
    .logo-pulse::before,
    .logo-pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(31, 95, 212, .22) 0%, rgba(31, 95, 212, 0) 68%);
    }
    .logo-pulse::before { animation: breathe 2.4s ease-in-out infinite; }
    .logo-pulse::after { animation: breathe 2.4s ease-in-out infinite .8s; }
    @keyframes breathe {
      0%, 100% { transform: scale(.82); opacity: .75; }
      50% { transform: scale(1.18); opacity: 0; }
    }
    .logo-icon {
      position: relative; z-index: 1;
      width: 52px; height: 52px;
      display: grid; place-items: center;
      animation: logoFloat 3s ease-in-out infinite;
      transition: filter .35s ease;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    /* 原图自带蓝色方底与圆角，故不做圆角/底色/阴影加工 */
    .logo-icon img { width: 52px; height: 52px; display: block; }
    /* 成功态：logo 转绿（与弹窗离线转灰同一套语义语言） */
    /* 成功态：蓝色火箭 → 绿色，用 filter 实现，不改图 */
    .launch-card[data-phase="ok"] .logo-icon {
      filter: hue-rotate(-42deg) saturate(1.7) brightness(1.02);
      animation: none;
    }
    .launch-card[data-phase="ok"] .logo-pulse::before,
    .launch-card[data-phase="ok"] .logo-pulse::after {
      background: radial-gradient(circle, rgba(31, 157, 92, .24) 0%, rgba(31, 157, 92, 0) 68%);
      animation: none; opacity: .8;
    }

    h1 { font-size: 20px; font-weight: 800; letter-spacing: -.3px; color: #0f1c33; line-height: 1.25; }
    .subtitle { font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: 4px; }

    /* ---------- 进度条：让等待有刻度（接力页最缺的东西） ---------- */
    .progress {
      width: 100%; margin-top: 20px;
      height: 4px; border-radius: 999px;
      background: rgba(31, 95, 212, .12);
      overflow: hidden;
    }
    .progress > i {
      display: block; height: 100%; width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue-l), var(--blue));
      transition: width .45s cubic-bezier(.2, .8, .3, 1);
    }
    .launch-card[data-phase="ok"] .progress > i {
      width: 100% !important;
      background: linear-gradient(90deg, #2fbe7c, var(--ok));
    }

    /* ---------- 状态徽章 ---------- */
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 14px; padding: 7px 15px;
      border-radius: 999px;
      font-size: 12.5px; font-weight: 600;
      background: rgba(255, 255, 255, .7);
      border: 1px solid var(--line);
      color: var(--ink-2);
      transition: background .3s ease, color .3s ease, border-color .3s ease;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #e0a12c; flex: 0 0 auto;
      animation: blink 1.1s ease-in-out infinite alternate;
    }
    @keyframes blink { from { opacity: .35; } to { opacity: 1; } }
    .status-badge.ok { background: var(--ok-bg); color: #046c43; border-color: var(--ok-line); }
    .status-badge.ok .status-dot { background: var(--ok); animation: none; }
    .status-badge.warn { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-line); }
    .status-badge.warn .status-dot { animation: none; }

    /* ---------- 注释块：暖色（与弹窗同语言） ---------- */
    .tip-box {
      width: 100%; margin-top: 18px;
      padding: 11px 13px; border-radius: 12px;
      text-align: left;
      display: flex; gap: 9px; align-items: flex-start;
      background: linear-gradient(150deg, rgba(255, 240, 235, .94), var(--rose-bg));
      border: 1px solid var(--rose-line);
      box-shadow: 0 2px 8px rgba(196, 64, 42, .10);
    }
    .tip-box[hidden] { display: none; }
    .tip-icon { flex: 0 0 auto; width: 15px; height: 15px; margin-top: 1px; color: var(--rose); }
    .tip-text { font-size: 12.5px; line-height: 1.5; color: #9c4a35; }
    .tip-text b { color: var(--rose); font-weight: 700; }
    /* 「多次未感应」后加深：此刻确实需要用户动手 */
    .tip-box[data-tone="deep"] {
      background: linear-gradient(150deg, rgba(253, 234, 229, .96), #f8ddd6);
      border-color: #e8b3a5;
    }
    .tip-box[data-tone="deep"] .tip-icon,
    .tip-box[data-tone="deep"] .tip-text b { color: #7d2717; }
    .tip-box[data-tone="rose"] .tip-icon { color: var(--rose); }
    .tip-box[data-tone="rose"] .tip-text { color: #9c4a35; }
    .tip-box[data-tone="rose"] .tip-text b { color: var(--rose); }

    /* ---------- 按钮 ---------- */
    .actions { display: flex; gap: 10px; width: 100%; margin-top: 18px; }
    .btn {
      flex: 1; height: 42px;
      border-radius: 11px; border: 1px solid transparent;
      font-family: inherit; font-size: 13px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer;
      transition: background .16s ease, box-shadow .16s ease, transform .08s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--blue-l); outline-offset: 2px; }
    .btn.primary {
      background: linear-gradient(150deg, var(--blue-l), var(--blue));
      color: #fff;
      box-shadow: 0 4px 14px rgba(31, 95, 212, .28);
    }
    .btn.primary:hover { background: linear-gradient(150deg, var(--blue), var(--blue-d)); }
    .btn.primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
    .btn.ghost { background: rgba(255, 255, 255, .8); color: var(--ink-2); border-color: var(--line); }
    .btn.ghost:hover { background: #fff; color: var(--blue-d); }
    .btn-ico { width: 14px; height: 14px; }

    .foot {
      margin-top: 16px;
      font-size: 11px; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .foot .pill {
      font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
      background: var(--tint); color: var(--blue);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="launch-card" id="launchCard" data-phase="wait">
    <div class="header-row">
      <div class="logo-pulse">
        <div class="logo-icon">
          <img src="icons/pocketfleet-128.png" alt="" width="52" height="52" />
        </div>
      </div>
      <div class="header-text">
        <h1 id="headline">启动 PocketFleet</h1>
        <p class="subtitle" id="subTitleText">通过系统协议调用桌面客户端……</p>
      </div>
    </div>

    <div class="progress" role="progressbar" aria-label="启动进度" id="progressTrack"><i id="progressBar"></i></div>

    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">尚未检测到客户端——点击重新启动</span>
    </div>

    <div style="margin-top: 14px; text-align: center; font-size: 12px; color: var(--muted);" id="downloadArea">
      <span id="downloadPrefix">尚未安装客户端？</span><a href="https://pocketfleet.data-records.net" target="_blank" style="color: var(--blue); text-decoration: underline; font-weight: 600;" id="downloadLink">前往 pocketfleet.data-records.net 下载桌面端 →</a>
    </div>

    <div class="foot" style="margin-top: 8px; justify-content: center;"><span class="pill">127.0.0.1:18765</span><span id="footText">客户端准备就绪后，此页面将自动关闭。</span></div>

    <div class="tip-box" id="tipBox">
      <svg class="tip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2Z"></path></svg>
      <div class="tip-text" id="tipText">
        如果应用程序未运行，<b>请手动打开 PocketFleet</b>。
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnRetryLaunch" type="button">
        <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
        <span id="btnRetryLabel">重新启动</span>
      </button>
      <button class="btn ghost" id="btnCloseTab" type="button">关闭此页面</button>
    </div>
  </div>

  <script src="launch.js"></script>
</body>
</html>
